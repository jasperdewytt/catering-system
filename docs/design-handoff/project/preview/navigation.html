<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; background: var(--surface-app); display: flex; height: 320px; }
  .rail {
    width: 220px; background: white; border-right: 1px solid var(--border-1);
    padding: 14px 8px; display: flex; flex-direction: column; gap: 2px;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; border-bottom: 1px solid var(--border-2); margin-bottom: 10px; }
  .brand img { width: 24px; height: 24px; border-radius: 5px; }
  .brand .word { font-family: var(--font-serif); font-style: italic; font-size: 19px; color: var(--padea-ink); letter-spacing: -0.01em; }
  .brand .sub { font: 500 9px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-4); margin-top: 2px; }
  .item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-radius: 6px;
    font: 500 13px/1 var(--font-sans); color: var(--fg-2);
    cursor: pointer; position: relative;
    border-left: 2px solid transparent; margin-left: -2px;
  }
  .item:hover { background: var(--n-50); color: var(--fg-1); }
  .item.active { background: var(--padea-crimson-tint); color: var(--padea-crimson); border-left-color: var(--padea-crimson); }
  .item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .count { margin-left: auto; font: 500 10px/1 var(--font-mono); color: var(--fg-4); }
  .item.active .count { color: var(--padea-crimson); }
</style>
</head>
<body>
  <div class="rail">
    <div class="brand">
      <img src="../assets/padea-logo.jpg" alt="">
      <div><div class="word">Padea</div><div class="sub">Catering Ops</div></div>
    </div>
    <div class="item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</div>
    <div class="item active"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Weeks</div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M3 11l3-8 3 8M6 21V11M21 15a2 2 0 0 1-4 0V3M14 8l4-4 4 4"/></svg>Menu<span class="count">3</span></div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>Validation</div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M10 13l2 2 4-4"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>Orders<span class="count">2</span></div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>Exports</div>
  </div>
  <div style="flex:1; padding: 28px; color: var(--fg-4); font: 400 13px/1.5 var(--font-sans);">
    Active navigation uses a 2px crimson left bar plus a tint background and crimson text. All other states stay neutral.
  </div>
</body>
</html>
