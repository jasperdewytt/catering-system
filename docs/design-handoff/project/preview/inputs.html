<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-card); display: flex; gap: 28px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .label { font: 500 12px/1 var(--font-sans); color: var(--fg-2); }
  .helper { font: 400 11px/1.3 var(--font-sans); color: var(--fg-4); }
  .helper.err { color: var(--err-fg); }
  input, select {
    font: 400 14px/1 var(--font-sans);
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--border-1);
    background: white;
    color: var(--fg-1);
    outline: none;
  }
  input:focus { border-color: var(--border-focus); box-shadow: var(--shadow-focus); }
  input.err { border-color: var(--err-solid); }
  input.err:focus { box-shadow: var(--shadow-focus-danger); }
  input.disabled { background: var(--n-100); color: var(--fg-4); cursor: not-allowed; }
  .check { display: flex; align-items: center; gap: 8px; font: 400 13px/1 var(--font-sans); color: var(--fg-2); }
  .check input { accent-color: var(--padea-crimson); }
</style>
</head>
<body>
  <div class="col">
    <div class="field">
      <span class="label">Caterer</span>
      <input value="Padea Kitchen Co.">
    </div>
    <div class="field">
      <span class="label">Service week</span>
      <input value="2026-10-06" class="mono" style="font-family:var(--font-mono); font-size:13px">
    </div>
    <div class="field">
      <span class="label">Forecast quantity</span>
      <input value="" placeholder="Enter quantity">
      <span class="helper">Used for minimum-order calculation.</span>
    </div>
  </div>
  <div class="col">
    <div class="field">
      <span class="label">Reason</span>
      <input value="Override: late absence" class="err">
      <span class="helper err">Reason must reference a session ID.</span>
    </div>
    <div class="field">
      <span class="label">Approval note</span>
      <input value="Approved by ops lead" disabled class="disabled">
    </div>
    <label class="check"><input type="checkbox" checked> Reviewed for GF / DF / NF</label>
    <label class="check"><input type="checkbox"> Mark variant unavailable</label>
  </div>
</body>
</html>
