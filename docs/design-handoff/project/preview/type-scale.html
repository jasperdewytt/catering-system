<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-card); }
  .row { display: grid; grid-template-columns: 80px 1fr; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border-2); }
  .row:last-child { border: none; }
  .tag { font: 500 11px/1 var(--font-mono); color: var(--fg-4); }
  .spec { color: var(--fg-1); }
  .h1 { font: 600 26px/1.15 var(--font-sans); letter-spacing: -0.012em; }
  .h2 { font: 600 20px/1.2 var(--font-sans); letter-spacing: -0.012em; }
  .h3 { font: 600 16px/1.3 var(--font-sans); }
  .body { font: 400 15px/1.45 var(--font-sans); color: var(--fg-2); }
  .ts { font: 500 14px/1.4 var(--font-mono); color: var(--fg-3); letter-spacing: 0; }
</style>
</head>
<body>
  <div class="row"><div class="tag">H1 / 26</div><div class="spec h1">Week of 6 October</div></div>
  <div class="row"><div class="tag">H2 / 20</div><div class="spec h2">Needs attention</div></div>
  <div class="row"><div class="tag">H3 / 16</div><div class="spec h3">Padea Kitchen Co. — 3 sessions</div></div>
  <div class="row"><div class="tag">Body / 15</div><div class="spec body">Run 24-W18-03 generated 14 order lines across 4 caterers.</div></div>
  <div class="row"><div class="tag">Mono / 14</div><div class="spec ts">24-W18-03 · 2026-10-06 09:14:22Z</div></div>
</body>
</html>
