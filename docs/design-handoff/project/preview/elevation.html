<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--surface-app); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .card {
    width: 80px; height: 80px; background: white; border-radius: 10px;
    border: 1px solid var(--border-1);
  }
  .lbl { font: 500 11px/1 var(--font-mono); color: var(--fg-3); }
</style>
</head>
<body>
  <div class="grid">
    <div class="col"><div class="card" style="box-shadow: var(--shadow-xs)"></div><span class="lbl">xs</span></div>
    <div class="col"><div class="card" style="box-shadow: var(--shadow-sm)"></div><span class="lbl">sm · card</span></div>
    <div class="col"><div class="card" style="box-shadow: var(--shadow-md)"></div><span class="lbl">md · drawer</span></div>
    <div class="col"><div class="card" style="box-shadow: var(--shadow-lg)"></div><span class="lbl">lg · popover</span></div>
    <div class="col"><div class="card" style="box-shadow: var(--shadow-pop)"></div><span class="lbl">pop · dialog</span></div>
  </div>
</body>
</html>
