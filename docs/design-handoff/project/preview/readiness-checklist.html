<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-app); }
  .card {
    background: white; border: 1px solid var(--border-1); border-radius: 10px;
    box-shadow: var(--shadow-sm); padding: 18px 20px;
  }
  .hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .title { font: 600 14px/1.3 var(--font-sans); color: var(--fg-1); }
  .meta { font: 500 11px/1 var(--font-mono); color: var(--fg-4); }
  .item { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border-2); }
  .item:last-child { border: none; padding-bottom: 0; }
  .check {
    width: 18px; height: 18px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .check svg { width: 11px; height: 11px; stroke-width: 3; fill: none; }
  .ok    { background: var(--ok-bg); border: 1px solid var(--ok-border); }
  .ok svg { stroke: var(--ok-solid); }
  .warn  { background: var(--warn-bg); border: 1px solid var(--warn-border); }
  .warn svg { stroke: var(--warn-solid); }
  .pend  { background: white; border: 1.5px solid var(--border-strong); }
  .label { font: 500 13px/1 var(--font-sans); color: var(--fg-1); flex: 1; }
  .sub { font: 400 12px/1 var(--font-mono); color: var(--fg-4); }
</style>
</head>
<body>
  <div class="card">
    <div class="hdr">
      <span class="title">Readiness — Week of 6 Oct</span>
      <span class="meta">4 of 6 ready</span>
    </div>
    <div class="item">
      <div class="check ok"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div>
      <span class="label">Source data ingested</span><span class="sub">2026-10-03 14:22</span>
    </div>
    <div class="item">
      <div class="check ok"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div>
      <span class="label">Menu offers selected</span><span class="sub">14 offers · 4 caterers</span>
    </div>
    <div class="item">
      <div class="check warn"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/></svg></div>
      <span class="label">Dish variants reviewed</span><span class="sub">3 unreviewed</span>
    </div>
    <div class="item">
      <div class="check pend"></div>
      <span class="label">Validation passed</span><span class="sub">Run pending</span>
    </div>
  </div>
</body>
</html>
