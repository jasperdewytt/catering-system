[project]
name = "padea-catering"
version = "0.1.0"
description = "Catering operations system for Padea — weekly school tutoring meal ordering."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "supabase>=2.7,<2.30",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "streamlit>=1.36",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padea_catering"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
